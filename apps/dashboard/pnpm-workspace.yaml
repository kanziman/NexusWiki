# pnpm 설정. task `P2-CI-01` · `checklists.json > decisions.db_access`(게이트가 지키는 경계)
#
# ⚠️ 이 파일이 없으면 CI의 `pnpm install --frozen-lockfile`이 ERR_PNPM_IGNORED_BUILDS로
#    죽고, 그러면 이 저장소의 보안 게이트 2개(`pre-commit`, `bundle-secrets`)가 위반
#    유무와 무관하게 전부 red가 된다. 모든 것에 red를 내는 검사는 아무것도 지키지 않으므로
#    이건 스타일 설정이 아니라 게이트의 전제다.
#
# ⚠️ 설정을 `package.json`의 `pnpm` 필드에 두지 말 것 — pnpm 11은 그 필드를 읽지 않고
#    조용히 무시한다(경고만 남긴다). 설정의 새 집이 이 파일이다.
#
# 빌드 스크립트를 허용할 의존성만 열거한다. 열거되지 않은 패키지의 postinstall은 실행되지
# 않으며, 그것이 기본값이다 — 공급망 관점에서 임의 코드 실행을 명시 승인으로 좁힌다.
#   sharp         Next.js 이미지 최적화용 네이티브 바이너리
#   unrs-resolver eslint 모듈 해석기 네이티브 바이너리
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
