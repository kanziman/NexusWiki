# pnpm 설정. task `P2-CI-01` · 게이트가 지키는 경계는 `checklists.json > decisions.db_access`
#
# ⚠️ 이 파일이 없으면 CI의 `pnpm install --frozen-lockfile`이 ERR_PNPM_IGNORED_BUILDS로
#    죽고, 그러면 이 저장소의 게이트 2개(`pre-commit`, `bundle-secrets`)가 위반 유무와
#    무관하게 전부 red가 된다. 모든 것에 red를 내는 검사는 아무것도 지키지 않으므로
#    이건 스타일 설정이 아니라 게이트의 전제다.
#
# ⚠️ 키 이름 함정 두 개. 둘 다 에러 없이 조용히 무시되므로 원래의 실패가 그대로 남는다.
#    1. `package.json`의 `pnpm` 필드 — pnpm 11은 읽지 않는다(경고만 남긴다).
#    2. `onlyBuiltDependencies` — pnpm 11에서 제거됐다. 현재 키는 `allowBuilds`이며
#       리스트가 아니라 패키지→불리언 맵이다.
#    `.npmrc`도 답이 아니다 — pnpm 11은 auth/registry 외의 설정을 .npmrc에서 읽지 않는다.
#
# ⚠️ 로컬에서 `node_modules`가 이미 차 있으면 install이 no-op이라 이 분기를 타지 않는다.
#    검증하려면 `rm -rf node_modules` 후 설치할 것 — 그러지 않으면 통과가 위양성이다.
#
# `strictDepBuilds`는 기본 true이고, 여기 열거되지 않은 패키지는 "미검토"로 간주되어 설치가
# 실패한다. 즉 새 의존성이 postinstall을 들고 들어오면 CI가 먼저 멈춘다 — 공급망 관점에서
# 임의 코드 실행을 명시 승인으로 좁히는 장치이므로 끄지 않는다.
#   sharp         Next.js 이미지 최적화용 네이티브 바이너리
#   unrs-resolver eslint 모듈 해석기 네이티브 바이너리
allowBuilds:
  sharp: true
  unrs-resolver: true
