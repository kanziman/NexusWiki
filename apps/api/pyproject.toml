[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "nexuswiki-core",
  "uvicorn==0.52.0",
]

[tool.uv.sources]
nexuswiki-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
